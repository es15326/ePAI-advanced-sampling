model: Generic_TransUNet_max_ppbp
model_params:
  is_masked_attn: True
  max_dec_layers: 3
  is_max_bottleneck_transformer: False
  # vit_depth: 1
  max_msda: ''
  is_max_ms: True # num_feature_levels: 3; default fpn downsampled to os244
  max_ms_idxs: [-4, -3, -2]
  max_hidden_dim: 192
  mw: 1.0
  is_max_ds: True
  is_masking: True
  is_max_hungarian: True
  num_queries: 20
  is_max_cls: True
  is_mhsa_float32: True

max_loss_cal: 'v1'
disable_ds: True
initial_lr: 3e-4
optim_name: adamw
lrschedule: warmup_cosine
resume: ''
warmup_epochs: 10
max_num_epochs: 1000 # used 8 cards as default
task: Task1006-YC_3mm_6cls_Padded_dataset
network: 3d_fullres
network_trainer: nnUNetTrainerV2_DDP
hdfs_base: GeTU1006_3DTransUNet_epo1000
